<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pen Edge | Sales Execution &amp; Analytics</title>
    <meta name="description" content="Enterprise field sales execution, trade tracking, outlet management, and real-time attendance analytics platform." />
    <meta name="theme-color" content="#075544" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pen Edge" />
    <script>
      (function() {
        try {
          var scheme = localStorage.getItem("penedge_color_scheme") || "light";
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = scheme === "dark" || (scheme === "system" && prefersDark);
          var effective = isDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", effective);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          if (localStorage.getItem("penedge_compact_mode") === "true") {
            document.documentElement.classList.add("compact-mode");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
