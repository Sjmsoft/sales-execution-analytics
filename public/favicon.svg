<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background rounded square with subtle dark emerald gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a13" />
      <stop offset="50%" stop-color="#04261c" />
      <stop offset="100%" stop-color="#02140e" />
    </linearGradient>

    <!-- 3D Sail Faces: Front, Top/Light, and Side Extrusion -->
    <linearGradient id="sailFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="35%" stop-color="#60a5fa" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sailSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sailTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4" />
    </linearGradient>

    <!-- 3D Keel Faces: Front and Extrusion -->
    <linearGradient id="keelFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="keelSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="1" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
    <radialGradient id="contactShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base container tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Elliptical contact shadow underneath 3D object -->
  <ellipse cx="32" cy="51" rx="20" ry="4.5" fill="url(#contactShadow)" />

  <g filter="url(#glow3d)">
    <!-- 3D Extrusion Side (Sail) -->
    <path d="M22 41 L25 43.5 L46 43.5 L46 40 L41 12 L38 9.5 Z" fill="url(#sailSide)" opacity="0.95" />

    <!-- 3D Front Face (Sail) -->
    <!-- Polygon skewed sail: top peak at (38, 10), right corner (43, 40), left corner (20, 40) -->
    <path d="M38 10 L43 40 L20 40 Z" fill="url(#sailFront)" />

    <!-- Specular highlight facet on top crest -->
    <path d="M38 10 L40 18 L34 22 Z" fill="url(#sailTop)" />

    <!-- 3D Keel Extrusion / Underbelly -->
    <path d="M12 43.5 L50 33 L52 35 L14 45.5 Z" fill="url(#keelSide)" />

    <!-- 3D Keel Front Face -->
    <rect x="12" y="42" width="40" height="3" rx="1.5" transform="rotate(-15 12 42)" fill="url(#keelFront)" />
  </g>
</svg>